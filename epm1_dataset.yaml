# Конфигурационный файл датасета для дообучения YOLO11
# Датасет: single_animal_tracking/epm_1.mp4
# Размер изображений: 1280x960

# Путь к корневой директории датасета (относительно этого файла)
path: yolo_dataset_epm1

# Пути к изображениям для обучения и валидации (относительно path)
train: images/train
val: images/val
